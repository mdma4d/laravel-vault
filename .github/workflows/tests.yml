name: tests

# Manual-only: this workflow never runs automatically on push or pull request.
# Start it by hand from the Actions tab ("Run workflow") if/when needed.
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    name: L${{ matrix.laravel }} · PHP ${{ matrix.php }} · ${{ matrix.deps == '--prefer-lowest' && 'lowest' || 'latest' }}

    # The matrix intentionally installs end-of-life Laravel 8-11 (which carry
    # security advisories and pull abandoned packages) to verify code
    # compatibility. Disable Composer install blocking for the test harness.
    env:
      COMPOSER_NO_BLOCKING: "1"
      COMPOSER_NO_SECURITY_BLOCKING: "1"

    strategy:
      fail-fast: false
      matrix:
        include:
          # ---- Laravel 8 (Testbench 6.x) ----
          - { laravel: '8.*',  testbench: '6.*',  php: '8.0', deps: '--prefer-lowest' }
          - { laravel: '8.*',  testbench: '6.*',  php: '8.1', deps: '' }
          # ---- Laravel 9 (Testbench 7.x) ----
          - { laravel: '9.*',  testbench: '7.*',  php: '8.0', deps: '--prefer-lowest' }
          - { laravel: '9.*',  testbench: '7.*',  php: '8.2', deps: '' }
          # ---- Laravel 10 (Testbench 8.x) ----
          - { laravel: '10.*', testbench: '8.*',  php: '8.1', deps: '--prefer-lowest' }
          - { laravel: '10.*', testbench: '8.*',  php: '8.3', deps: '' }
          # ---- Laravel 11 (Testbench 9.x) ----
          - { laravel: '11.*', testbench: '9.*',  php: '8.2', deps: '--prefer-lowest' }
          - { laravel: '11.*', testbench: '9.*',  php: '8.3', deps: '' }
          # ---- Laravel 12 (Testbench 10.x) ----
          - { laravel: '12.*', testbench: '10.*', php: '8.2', deps: '--prefer-lowest' }
          - { laravel: '12.*', testbench: '10.*', php: '8.3', deps: '' }
          # ---- Laravel 13 (Testbench 11.x) ----
          - { laravel: '13.*', testbench: '11.*', php: '8.3', deps: '--prefer-lowest' }
          - { laravel: '13.*', testbench: '11.*', php: '8.3', deps: '' }
          - { laravel: '13.*', testbench: '11.*', php: '8.4', deps: '' }
          - { laravel: '13.*', testbench: '11.*', php: '8.5', deps: '' }

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, openssl, json, ctype, dom, xml, libxml, tokenizer, fileinfo, curl, pdo, pdo_sqlite, sqlite3
          coverage: none

      - name: Validate composer.json
        run: composer validate --strict

      - name: Select Laravel & Testbench versions
        run: >
          composer require
          "laravel/framework:${{ matrix.laravel }}"
          "orchestra/testbench:${{ matrix.testbench }}"
          --dev --no-update --no-interaction

      - name: Install dependencies
        run: >
          composer update ${{ matrix.deps }}
          --prefer-dist --no-interaction --no-progress --with-all-dependencies

      - name: Show installed versions
        run: composer show laravel/framework orchestra/testbench phpunit/phpunit

      - name: Run tests
        run: vendor/bin/phpunit
